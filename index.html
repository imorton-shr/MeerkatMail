// ── State ──
let currentLanguage = "en";

let currentAudio = null;
let currentModalAudioId = null;

// ── Audio System ──
function playAudio(id) {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    document.querySelectorAll('.audio-ripple').forEach(el => el.classList.remove('playing'));
  }
  const file = `audio/${id}-${currentLanguage}.mp3`;
  currentAudio = new Audio(file);
  const btn = document.getElementById('modal-audio-btn');
  if (btn) btn.classList.add('playing');
  currentAudio.play().catch(() => {
    console.log("Missing audio:", file);
    if (btn) btn.classList.remove('playing');
  });
  currentAudio.addEventListener('ended', () => {
    if (btn) btn.classList.remove('playing');
  });
}

function playModalAudio() {
  if (currentModalAudioId) {
    playAudio(currentModalAudioId);
  }
}

// ── Language System ──
function switchLanguage(lang) {
  currentLanguage = lang;
  // Update buttons
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.remove('lang-btn-active');
    if (btn.dataset.lang === lang) btn.classList.add('lang-btn-active');
  });
  // Update all translatable elements
  document.querySelectorAll('[data-en]').forEach(el => {
    const text = el.getAttribute(`data-${lang}`);
    if (text) el.textContent = text;
  });
  // Re-render topic content
  renderTopic();
}

// ── Topic System ──
function switchTopic(topic) {
  currentTopic = topic;
  document.querySelectorAll('.topic-btn').forEach(btn => {
    btn.classList.remove('topic-btn-active');
    if (btn.dataset.topic === topic) btn.classList.add('topic-btn-active');
  });
  renderTopic();
}

function renderTopic() {

  const area = document.getElementById('content-area');

  area.innerHTML = `

    <div class="text-center mb-6 animate-pop-in">

    <!-- Expandable Cards -->
    <div class="space-y-3 mb-8">
      ${data.cards.map((card, i) => `

                  onclick="toggleCard('${card.id}')">

        <span class="text-3xl animate-sparkle" style="animation-delay: 0.5s;">⭐</span>

// ── Modal System ──
function openModal(cardId) {
  const data = topicData[currentTopic];
  const lang = currentLanguage;
  const card = data.cards.find(c => c.id === cardId);
  if (!card) return;

  currentModalAudioId = cardId;
  document.getElementById('modal-emoji').textContent = card.emoji;
  document.getElementById('modal-title').textContent = card.title[lang];
  document.getElementById('modal-body').innerHTML = `
    <p class="text-base leading-relaxed">${card.detail[lang]}</p>
  `;

  showModal();
  playAudio(cardId);
}

function openFactModal(factId) {
  const data = topicData[currentTopic];
  const lang = currentLanguage;
  const fact = data.facts.find(f => f.id === factId);
  if (!fact) return;

  currentModalAudioId = factId;
  document.getElementById('modal-emoji').textContent = fact.emoji;
  document.getElementById('modal-title').textContent = fact.title[lang];
  document.getElementById('modal-body').innerHTML = `
    <p class="text-base leading-relaxed">${fact.text[lang]}</p>
  `;

  showModal();
  playAudio(factId);
}

function toggleCard(cardId) {
  const content = document.querySelector(`.card-content-${cardId}`);
  const chevron = content.parentElement.querySelector('.card-chevron');
  const isExpanded = content.style.maxHeight && content.style.maxHeight !== '0px';

  if (isExpanded) {
    content.style.maxHeight = '0px';
    chevron.style.transform = 'rotate(0deg)';
  } else {
    content.style.maxHeight = content.scrollHeight + 'px';
    chevron.style.transform = 'rotate(180deg)';
    playAudio(cardId);
  }
}

function toggleFactsBox() {
  const factsContent = document.getElementById('facts-content');
  const chevron = document.getElementById('facts-chevron');
  const isExpanded = factsContent.style.maxHeight && factsContent.style.maxHeight !== '0px';

  if (isExpanded) {
    factsContent.style.maxHeight = '0px';
    chevron.style.transform = 'rotate(0deg)';
  } else {
    factsContent.style.maxHeight = factsContent.scrollHeight + 'px';
    chevron.style.transform = 'rotate(180deg)';
  }
}

function showModal() {
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');
  overlay.style.display = 'flex';
  requestAnimationFrame(() => {
    overlay.style.opacity = '1';
    content.style.transform = 'scale(1)';
    content.style.opacity = '1';
  });
  // Update listen button text
  const listenSpan = document.querySelector('#modal-audio-btn span[data-en]');
  if (listenSpan) {
    listenSpan.textContent = currentLanguage === 'en' ? 'Listen' : currentLanguage === 'th' ? 'ฟัง' : '听一听';
  }
  lucide.createIcons();
}

function closeModal() {
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');
  overlay.style.opacity = '0';
  content.style.transform = 'scale(0.9)';
  content.style.opacity = '0';
  setTimeout(() => {
    overlay.style.display = 'none';
  }, 300);
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    document.querySelectorAll('.audio-ripple').forEach(el => el.classList.remove('playing'));
  }
}

// Close modal on overlay click
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ── Element SDK ──
const defaultConfig = {
  site_title: "Meerkat Explorer",
  welcome_message: "Explore the amazing world of meerkats and their homes!",
  background_color: "#fffbeb",
  surface_color: "#ffffff",
  text_color: "#78350f",
  primary_action_color: "#f59e0b",
  secondary_action_color: "#10b981",
  font_family: "Fredoka",
  font_size: 16
};

function applyConfig(config) {
  const title = config.site_title || defaultConfig.site_title;
  const welcome = config.welcome_message || defaultConfig.welcome_message;
  const bg = config.background_color || defaultConfig.background_color;
  const surface = config.surface_color || defaultConfig.surface_color;
  const textCol = config.text_color || defaultConfig.text_color;
  const primary = config.primary_action_color || defaultConfig.primary_action_color;
  const secondary = config.secondary_action_color || defaultConfig.secondary_action_color;
  const font = config.font_family || defaultConfig.font_family;
  const fontSize = config.font_size || defaultConfig.font_size;

  // Title
  const titleEl = document.getElementById('site-title');
  if (titleEl) titleEl.textContent = title;

  // Welcome
  const welcomeEl = document.getElementById('welcome-msg');
  if (welcomeEl && currentLanguage === 'en') welcomeEl.textContent = welcome;

  // Background
  const app = document.getElementById('app');
  if (app) app.style.background = `linear-gradient(180deg, ${bg} 0%, ${bg}ee 40%, ${primary}33 100%)`;

  // Text color
  document.querySelectorAll('h1, h2').forEach(el => el.style.color = textCol);

  // Font
  document.querySelectorAll('.font-heading, h1, h2, h3, button').forEach(el => {
    el.style.fontFamily = `${font}, Fredoka, cursive`;
  });
  document.querySelectorAll('p, span').forEach(el => {
    el.style.fontFamily = `${font}, Quicksand, sans-serif`;
  });

  // Font size
  const base = fontSize;
  document.querySelectorAll('p').forEach(el => el.style.fontSize = `${base}px`);
  const h1 = document.querySelector('h1');
  if (h1) h1.style.fontSize = `${base * 2.5}px`;
}

if (window.elementSdk) {
  window.elementSdk.init({
    defaultConfig,
    onConfigChange: async (config) => {
      applyConfig(config);
    },
    mapToCapabilities: (config) => ({
      recolorables: [
        { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
        { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
        { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
        { get: () => config.primary_action_color || defaultConfig.primary_action_color, set: (v) => { config.primary_action_color = v; window.elementSdk.setConfig({ primary_action_color: v }); } },
        { get: () => config.secondary_action_color || defaultConfig.secondary_action_color, set: (v) => { config.secondary_action_color = v; window.elementSdk.setConfig({ secondary_action_color: v }); } }
      ],
      borderables: [],
      fontEditable: {
        get: () => config.font_family || defaultConfig.font_family,
        set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); }
      },
      fontSizeable: {
        get: () => config.font_size || defaultConfig.font_size,
        set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); }
      }
    }),
    mapToEditPanelValues: (config) => new Map([
      ["site_title", config.site_title || defaultConfig.site_title],
      ["welcome_message", config.welcome_message || defaultConfig.welcome_message]
    ])
  });
}
